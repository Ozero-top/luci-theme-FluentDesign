<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FD view harness</title>
<link rel="stylesheet" href="/luci-static/fluentdesign/css/cascade.css">
<style>
	body { position: static; overflow: auto; padding: 24px; background: #f3f3f3; }
	#view { max-width: 900px; margin: 0 auto; }
	#harness-report { position: fixed; top: 8px; right: 8px; width: 320px;
		max-height: 90vh; overflow: auto; font: 12px/1.5 monospace; z-index: 99999;
		background: #111; color: #9f9; padding: 10px; border-radius: 8px; }
	#harness-report .fail { color: #ff7676; }
	#harness-report h4 { color: #fff; margin: 0 0 6px; }
</style>
</head>
<body>
<div id="maincontent"><div id="view"></div></div>
<div id="harness-report"><h4>harness</h4><div id="harness-log"></div></div>

<script>window.TR = {};</script>
<script src="/luci-static/resources/cbi.js"></script>
<script src="/luci-static/resources/luci.js?v=h4"></script>
<script>
'use strict';
/* skip startup RPC probes (features/preload/rpcBaseURL) */
sessionStorage.setItem('luci-session-store', JSON.stringify({
	'00000000000000000000000000000000': { features: {}, preload: [], rpcBaseURL: '/ubus/' }
}));
window.L = new LuCI({
	scriptname: '/cgi-bin/luci',
	resource: '/luci-static/resources',
	media: '/luci-static/fluentdesign',
	ubuspath: '/ubus',
	sessionid: '00000000000000000000000000000000',
	nodespec: { satisfied: true, readonly: false }
});

(async function() {
	const log = document.getElementById('harness-log');
	const results = [];
	function check(name, cond, extra) {
		results.push({ name, ok: !!cond, extra });
		const d = document.createElement('div');
		d.className = cond ? 'pass' : 'fail';
		d.textContent = (cond ? 'PASS ' : 'FAIL ') + name + (extra !== undefined ? '  [' + extra + ']' : '');
		log.appendChild(d);
	}

	await L.require('ui');
	await L.require('form');
	const request = await L.require('request');
	const uci = await L.require('uci');

	/* ---- fake ubus over request.post ---- */
	function reply(m) {
		if (m.method === 'list')
			return { jsonrpc: '2.0', id: m.id, result: {} };
		const obj = m.params[1], meth = m.params[2];
		if (obj === 'session' && meth === 'access')
			return { jsonrpc: '2.0', id: m.id, result: [0, { access: true }] };
		return { jsonrpc: '2.0', id: m.id, result: [0, {}] };
	}
	request.post = function(url, data) {
		const arr = Array.isArray(data) ? data : [data];
		const out = arr.map(reply);
		return Promise.resolve({
			ok: true, status: 200,
			json() { return Array.isArray(data) ? out : out[0]; }
		});
	};

	/* ---- fake UCI state ---- */
	const state = {
		'.type': 'global', '.name': 'global',
		mode: 'normal', primary: '#0078d4', dark_primary: '#2899f5',
		font_size: '1', blur: '30', acrylic_opacity: '0.7'
	};
	uci.load = function() { return Promise.resolve(); };
	uci.sections = function(cfg, type) {
		return (cfg === 'fluentdesign' && (type == null || type === 'global')) ? [state] : [];
	};
	uci.get = function(cfg, sid, opt) { return state[opt]; };
	uci.get_first = function(cfg, type) { return state; };
	uci.add = function() { return 'global'; };
	uci.unload = function() {};
	uci.save = function() { return Promise.resolve(); };
	uci.commit = function() { return Promise.resolve(); };
	uci.apply = function() { return Promise.resolve(0); };

	/* requiring a view auto-instantiates it: constructor runs load->render
	 * and mounts into #view, then appends the footer automatically */
	const v = await L.require('view/system/fluentdesign');
	for (let i = 0; i < 100 && !document.querySelector('#view .fd-segmented'); i++)
		await new Promise(r => setTimeout(r, 100));
	await new Promise(r => setTimeout(r, 200));
	const node = document.querySelector('#view .cbi-map');
	check('view mounted into #view', !!node);

	/* ============ structural checks ============ */
	const $ = s => document.querySelector(s);
	const $$ = s => Array.from(document.querySelectorAll(s));

	check('4 cbi-section cards', $$('.cbi-section').length === 4, $$('.cbi-section').length);
	check('segmented rendered', !!$('#cbid.fluentdesign.global.mode.fd-segmented, #cbid\\.fluentdesign\\.global\\.mode.fd-segmented')
		|| !!document.getElementById('cbid.fluentdesign.global.mode'));
	const seg = document.getElementById('cbid.fluentdesign.global.mode');
	check('segmented class', seg && seg.classList.contains('fd-segmented'));
	check('segmented 3 radios', seg && seg.querySelectorAll('button').length === 3);
	check('segmented initial value', seg && seg.getAttribute('data-value') === 'normal');
	check('segmented initial active', seg && seg.querySelector('button.active') &&
		seg.querySelector('button.active').textContent.indexOf('跟随系统') >= 0);

	const colors = $$('.fd-color');
	check('2 color widgets', colors.length === 2);
	check('7 presets each', colors.every(c => c.querySelectorAll('.fd-preset').length === 7));
	const prim = document.getElementById('cbid.fluentdesign.global.primary');
	check('primary initial', prim.getAttribute('data-value') === '#0078d4', prim.getAttribute('data-value'));
	check('hex input upper', prim.querySelector('.fd-hex-input').value === '#0078D4');

	const sliders = $$('.fd-slider');
	check('3 sliders', sliders.length === 3);
	const blur = document.getElementById('cbid.fluentdesign.global.blur');
	check('blur initial value', blur.getAttribute('data-value') === '30');
	check('blur label px', blur.querySelector('.fd-slider-value').textContent === '30 px');
	const fs = document.getElementById('cbid.fluentdesign.global.font_size');
	check('font label pct', fs.querySelector('.fd-slider-value').textContent === '100%');
	const op = document.getElementById('cbid.fluentdesign.global.acrylic_opacity');
	check('opacity label pct', op.querySelector('.fd-slider-value').textContent === '70%');

	check('bg path shown', $$('.fd-bgpath').length === 1 &&
		document.querySelector('.fd-bgpath').textContent.indexOf('/www/luci-static/fluentdesign/background/') >= 0);
	check('bg legend codes', $$('.fd-legend code').length >= 7);
	check('view css injected', !!document.getElementById('fd-settings-view-css'));
	check('view css href correct', (function() {
		var l = document.getElementById('fd-settings-view-css');
		return l && /^\/luci-static\/resources\/view\/system\/fluentdesign\.css/.test(l.getAttribute('href'));
	})());
	check('managed dark sheet injected', !!document.getElementById('fd-dark-managed-id') ||
		!!document.querySelector('link[href*="dark.css"]'));

	/* ============ interaction: segmented -> dark ============ */
	seg.querySelectorAll('button')[2].click();
	check('dark selected', seg.getAttribute('data-value') === 'dark');
	check('aria-checked switched', seg.querySelectorAll('button')[2].getAttribute('aria-checked') === 'true' &&
		seg.querySelectorAll('button')[0].getAttribute('aria-checked') === 'false');
	const darkSheet = document.querySelector('link[href*="dark.css"]');
	check('dark sheet enabled', darkSheet && darkSheet.disabled === false && darkSheet.media === 'all',
		'disabled=' + (darkSheet && darkSheet.disabled) + ' media=' + (darkSheet && darkSheet.media));
	check('preview primary dark', document.documentElement.style.getPropertyValue('--primary') === '#2899f5',
		document.documentElement.style.getPropertyValue('--primary'));

	/* segmented -> light */
	seg.querySelectorAll('button')[1].click();
	check('light selected', seg.getAttribute('data-value') === 'light');
	check('dark sheet disabled in light', darkSheet.disabled === true);
	check('preview primary light', document.documentElement.style.getPropertyValue('--primary') === '#0078d4');

	/* back to normal (media=auto) */
	seg.querySelectorAll('button')[0].click();
	check('normal media query restored', darkSheet.media === '(prefers-color-scheme: dark)', darkSheet.media);

	/* ============ interaction: hex input ============ */
	const hex = prim.querySelector('.fd-hex-input');
	hex.value = 'zzz';
	hex.dispatchEvent(new Event('input', { bubbles: true }));
	check('invalid hex flagged', hex.getAttribute('aria-invalid') === 'true');
	check('invalid hex not committed', prim.getAttribute('data-value') === '#0078d4');
	hex.value = '#AbC';
	hex.dispatchEvent(new Event('input', { bubbles: true }));
	check('3-digit hex normalized', prim.getAttribute('data-value') === '#aabbcc', prim.getAttribute('data-value'));
	check('3-digit input uppercased', hex.value === '#AABBCC');
	check('invalid flag cleared', hex.getAttribute('aria-invalid') === 'false');
	check('picker synced', prim.querySelector('input[type=color]').value === '#aabbcc');

	/* preset click */
	const preset = prim.querySelectorAll('.fd-preset')[3]; /* #5c2d91 */
	preset.click();
	check('preset committed', prim.getAttribute('data-value') === '#5c2d91');
	check('preset aria pressed', preset.getAttribute('aria-pressed') === 'true');
	check('swatch css var', prim.querySelector('.fd-swatch').style.getPropertyValue('--swatch') === '#5c2d91');

	/* color picker input */
	const picker = prim.querySelector('input[type=color]');
	picker.value = '#123456';
	picker.dispatchEvent(new Event('input', { bubbles: true }));
	check('picker commits', prim.getAttribute('data-value') === '#123456');

	/* ============ interaction: sliders ============ */
	const range = blur.querySelector('input[type=range]');
	range.value = '65';
	range.dispatchEvent(new Event('input', { bubbles: true }));
	check('slider data-value', blur.getAttribute('data-value') === '65');
	check('slider label updates', blur.querySelector('.fd-slider-value').textContent === '65 px');
	check('slider fill var', range.style.getPropertyValue('--fill') === '65%', range.style.getPropertyValue('--fill'));
	check('preview blur var', document.documentElement.style.getPropertyValue('--acrylic-blur') === '65px');

	const opRange = op.querySelector('input[type=range]');
	opRange.value = '0.42';
	opRange.dispatchEvent(new Event('input', { bubbles: true }));
	check('opacity step value', op.getAttribute('data-value') === '0.42');
	check('opacity label', op.querySelector('.fd-slider-value').textContent === '42%');
	check('preview opacity var', document.documentElement.style.getPropertyValue('--acrylic-opacity') === '0.42');

	const fsRange = fs.querySelector('input[type=range]');
	fsRange.value = '1.15';
	fsRange.dispatchEvent(new Event('input', { bubbles: true }));
	check('font preview var', document.documentElement.style.getPropertyValue('--font-scale') === '1.15');

	/* ============ save: read formvalue via DOM (same path as Map.save) ============ */
	const formValues = {
		mode: seg.getAttribute('data-value'),
		primary: prim.getAttribute('data-value'),
		dark_primary: document.getElementById('cbid.fluentdesign.global.dark_primary').getAttribute('data-value'),
		font_size: fs.getAttribute('data-value'),
		blur: blur.getAttribute('data-value'),
		acrylic_opacity: op.getAttribute('data-value')
	};
	check('formvalues all non-null', Object.values(formValues).every(v => v != null && v !== ''),
		JSON.stringify(formValues));

	/* ============ footer (auto-appended by View.__init__) ============ */
	const footer = document.querySelector('#view .cbi-page-actions');
	check('footer auto-rendered', !!footer && footer.querySelectorAll('button').length >= 2,
		footer ? footer.querySelectorAll('button').length + ' buttons' : 'no footer');
	if (footer)
		check('save&apply button present', footer.textContent.indexOf('Save & Apply') >= 0);

	/* ============ teardown cleanup ============ */
	node.remove();
	await new Promise(r => setTimeout(r, 150));
	check('managed sheet removed on leave', !document.querySelector('link[href*="dark.css"]'));
	check('view css removed on leave', !document.getElementById('fd-settings-view-css'));
	check('root vars cleaned', !document.documentElement.style.getPropertyValue('--primary'));

	const failed = results.filter(r => !r.ok).length;
	const h = document.createElement('h4');
	h.textContent = failed === 0 ? 'ALL %d CHECKS PASSED'.format(results.length)
		: '%d/%d FAILED'.format(failed, results.length);
	h.style.color = failed ? '#ff7676' : '#7ee787';
	log.prepend(h);
	window.__harness = { results, failed };
})().catch(function(e) {
	const d = document.createElement('div');
	d.className = 'fail';
	d.textContent = 'HARNESS ERROR: ' + (e && e.stack ? e.stack : e);
	document.getElementById('harness-log').appendChild(d);
});
</script>
</body>
</html>
