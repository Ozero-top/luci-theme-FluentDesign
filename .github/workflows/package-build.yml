name: Real package build

# Continuous packaging patrol: on relevant changes, PRs, manual dispatch and
# a weekly schedule, build the real .ipk/.apk with the official OpenWrt SDKs
# via the shared reusable workflow. Tagged releases are handled separately in
# release.yml.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-build.yml'
      - '.github/workflows/build-packages.yml'
      - 'Makefile'
      - 'ucode/**'
      - 'htdocs/**'
      - 'root/**'
  pull_request:
    paths:
      - '.github/workflows/package-build.yml'
      - '.github/workflows/build-packages.yml'
      - 'Makefile'
      - 'ucode/**'
      - 'htdocs/**'
      - 'root/**'
  workflow_dispatch:
  # Weekly packaging patrol every Monday 04:17 UTC.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  build:
    name: SDK packages
    uses: ./.github/workflows/build-packages.yml
